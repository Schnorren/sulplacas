name: Keep backend awake

# Pinga o backend a cada 10 min para evitar o spin-down do Render free.
# Sem isso, o backend "dorme" após ~15 min ocioso e o cliente pega cold start.
# Roda no próprio GitHub Actions — sem depender de serviço externo de terceiros.

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 minutos (UTC)
  workflow_dispatch: # permite disparar manualmente pelo painel do Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive
        run: |
          curl -fsS \
            --max-time 90 \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            https://sulplacas-api.onrender.com/api/keep-alive
